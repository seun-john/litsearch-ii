[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "litsearch-ii"
version = "0.1.0"
description = "A keyless literature-search MCP server: OpenAlex, Crossref, Europe PMC, PubMed, arXiv and ClinicalTrials.gov in one tool set. No accounts, no API keys."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "seun-john" }]
keywords = ["mcp", "literature-search", "openalex", "crossref", "pubmed", "europepmc", "arxiv", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["mcp>=2.0,<3", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "anyio>=4"]

[project.scripts]
litsearch-ii = "litsearch_ii.cli:main"

[project.urls]
Homepage = "https://github.com/seun-john/litsearch-ii"
Issues = "https://github.com/seun-john/litsearch-ii/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/litsearch_ii"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "RET"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]
